[workspace]
members = ["crates/courseinfo-core", "crates/courseinfo-worker"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
# wasm-bindgen needs target_features to generate externref exception wrappers.
strip = "debuginfo"
