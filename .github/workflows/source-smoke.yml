name: Weekly catalogue source smoke

on:
  schedule:
    # Monday 02:17 Hong Kong time, before the weekly catalogue refresh.
    - cron: '17 18 * * SUN'
  workflow_dispatch:

permissions:
  contents: read

# Serialize issue lookup/create across scheduled and manual runs.
concurrency:
  group: courseinfo-source-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Check live catalogue with production parsing rules
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build native production-parser smoke executable
        id: build
        continue-on-error: true
        timeout-minutes: 10
        run: cargo build --locked -p courseinfo-core --example smoke_parser
      - name: Check every discovered current-term department
        id: smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: node scripts/live-smoke.mjs
      - name: Publish run summary
        if: ${{ !cancelled() }}
        run: |
          if test -f smoke-results/summary.md; then
            cat smoke-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain report and rejected source pages
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: smoke-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Open or update failure issue
        if: ${{ !cancelled() && (steps.build.outcome == 'failure' || steps.smoke.outcome == 'failure') }}
        uses: actions/github-script@v7
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { join } = require('node:path');
            const moduleUrl = pathToFileURL(join(process.env.GITHUB_WORKSPACE, 'scripts/report-smoke.mjs'));
            const { reportSmoke } = await import(moduleUrl.href);
            await reportSmoke({
              github,
              context,
              buildOutcome: process.env.BUILD_OUTCOME,
              smokeOutcome: process.env.SMOKE_OUTCOME,
            });
      - name: Keep unsuccessful smoke checks visibly failed
        if: ${{ !cancelled() && (steps.build.outcome != 'success' || steps.smoke.outcome != 'success') }}
        run: exit 1
